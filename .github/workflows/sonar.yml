name: SonarQube

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  secret_gate_coverage:
    name: Secret gate coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout coverage source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - name: Set up coverage Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.12'
      - name: Install pinned coverage tool
        run: 'python -m pip install --only-binary :all: coverage==7.10.7'
      - name: Measure real gate and test subprocess coverage
        run: |
          mkdir -p build/secret-gate-coverage
          python -m coverage run --rcfile=.coveragerc.secret-gate scripts/test_secret_gate.py -q
          python -m coverage combine --rcfile=.coveragerc.secret-gate
          python -m coverage xml --rcfile=.coveragerc.secret-gate
      - name: Upload exact-run coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: secret-gate-coverage-${{ github.sha }}
          path: build/secret-gate-coverage/coverage.xml
          if-no-files-found: error

  sonar:
    needs: secret_gate_coverage
    if: ${{ always() }}
    name: SonarQube Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}

    steps:
      - name: Require successful coverage production
        env:
          COVERAGE_RESULT: ${{ needs.secret_gate_coverage.result }}
        run: |
          if [ "$COVERAGE_RESULT" != success ]; then
            echo "Coverage producer did not succeed; Sonar analysis blocked." >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Skip when SONAR_TOKEN is not configured
        if: env.SONAR_TOKEN == ''
        run: |
          echo "SONAR_TOKEN is not configured; skipping SonarQube scan."

      - name: Download exact-run coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: secret-gate-coverage-${{ github.sha }}
          path: build/secret-gate-coverage

      - name: Run SonarQube scan
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
        env:
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ env.SONAR_HOST_URL }}

      - name: Retain Sonar compute-task receipt
        if: ${{ always() && env.SONAR_TOKEN != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sonar-task-${{ github.sha }}
          path: .scannerwork/report-task.txt
          if-no-files-found: error
